<!DOCTYPE html>
<html lang="en" data-theme="%%THEME%%">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<title>Connect to vIDE</title>
<link rel="stylesheet" href="/mobile-assets/style.css">
</head>
<body>
<div class="page" style="text-align:center;gap:24px">
  <div>
    <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.5px">Connect to vIDE</h1>
    <p class="muted" style="margin-top:8px;font-size:14px">Enter the 5-digit PIN shown in the vIDE app</p>
  </div>
  %%PIN_ERROR%%
  <form method="POST" action="/auth" style="width:100%;display:flex;flex-direction:column;gap:12px">
    <input class="pin-input" name="pin" type="text" inputmode="numeric" maxlength="5" autocomplete="one-time-code" placeholder="00000"/>
    <button type="submit" class="btn">Connect</button>
  </form>
</div>
<script type="module" src="/mobile-assets/app.js"></script>
</body>
</html>
